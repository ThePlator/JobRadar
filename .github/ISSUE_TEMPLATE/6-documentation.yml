name: Documentation
description: Something in the README, wiki or docs is wrong, missing or unclear
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Link to the page or file and section
      placeholder: https://github.com/ThePlator/JobRadar/wiki/Getting-Started#4-first-time-setup
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording (optional)
