name: Website

# Publishes site/ to GitHub Pages. One-time setup: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Browsers keep styles.css and app.js for 10 minutes; a new index.html with old styles
      # looks broken. Tag each link with its file's hash so a change is fetched at once.
      - name: Version the CSS and JS links
        run: |
          css=$(sha256sum site/styles.css | cut -c1-10)
          js=$(sha256sum site/app.js | cut -c1-10)
          sed -i -e "s|href=\"styles.css\"|href=\"styles.css?v=$css\"|" \
                 -e "s|src=\"app.js\"|src=\"app.js?v=$js\"|" site/index.html
          grep -q "styles.css?v=$css" site/index.html && grep -q "app.js?v=$js" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
