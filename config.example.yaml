# Copy to config/config.yaml. Validated at start-up.

sources:
  telegram:
    enabled: true
    chats: ["@offcampusjobs", "@freshersjobs", -1001234567890]  # `jobradar chats` lists ids
    backfill_days: 3
  boards:                   # company job boards, read directly: jobs arrive minutes after posting
    enabled: true
    every_minutes: 20       # each board is read this often (spread out)
    # One section per hiring system: "Name: board name", the last part of the board's
    # address (job-boards.greenhouse.io/stripe -> stripe). A link to the board works too.
    greenhouse:
      Stripe:    stripe
      Razorpay:  razorpaysoftwareprivatelimited
    lever:
      Meesho:    meesho
    ashby:
      Sarvam AI: sarvam
    smartrecruiters:        # India postings only
      Bosch:     BoschGroup
    workday:                # India postings only; read at most every 30 min (unofficial API)
      NVIDIA:    nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite   # or the careers link
    oracle:                 # Oracle Recruiting Cloud; India postings only; at most every 30 min
      Zensar:    fa-etvl-saasfaprod1.fa.ocs.oraclecloud.com/CX_1          # or the careers link
  freehire:                 # freehire.me's job search: ~90 hiring systems in one public API
    enabled: false
    every_minutes: 30       # at least 15: someone else's free service
    countries: [IN]
    seniority: [intern, junior]
    categories: []          # e.g. [backend, fullstack, data_engineering]; empty: all
  pages:                    # pages that announce hiring drives instead of listing jobs
    enabled: true
    every_hours: 2          # 1 to 6; robots.txt is obeyed and no page is ever logged into
    # "Name: address". Empty on purpose: you pick each page, and you're responsible for
    # following its site's terms. `jobradar pages add <name> <url>` adds one.
    watch: {}
  email_forward:
    enabled: true
    folder: JobRadar      # forward jobs here (Gmail: a label + filter)
    poll_minutes: 2
  whatsapp: { enabled: false, port: 8765 }   # experimental, unofficial client — ban risk

llm:
  extract_model: "gemini/gemini-flash-lite-latest"  # extraction + scoring (cheap, fast)
  extract_mode: fallback    # fallback: LLM only when the page and post don't state role and
                            #   company (most posts do); always: every job (adds summaries)
  writer_model: "gemini/gemini-flash-latest"      # resumes + form answers (Pro has no free tier)
  # Groq alternative:
  # extract_model: "groq/llama-3.1-8b-instant"
  # writer_model:  "groq/llama-3.3-70b-versatile"
  daily_budget_inr: 15      # estimated at list prices; LLM work pauses until midnight when hit
  requests_per_minute: 10   # stay under your key's rate limit

filters:
  batch_years: [2025, 2026]
  degrees: ["B.Tech", "BE", "MCA"]
  locations: ["Bengaluru", "Hyderabad", "Pune", "Remote"]
  max_experience_years: 1
  exclude_companies: []

matching:
  profile_path: config/profile.yaml     # copy profile.example.yaml there and fill it in
  providers: [llm, skills_rule]         # tried in order; skills_rule needs no key, never alerts
  weights:                              # Match Score = 100 x weighted answers; changing these
    skills_coverage: 0.40               #   re-scores stored answers at the next start, free
    role_alignment: 0.30
    seniority_fit: 0.15
    location_ok: 0.15
  min_confidence: 0.5                   # below: "unsure", never alerted
  branch_strict: false                  # true: "CSE/IT only" jobs count as not eligible (hidden)
  hide_if_eligible_below: 0.2           # hide jobs you're clearly not eligible for
  alert_if_eligible_above: 0.7          # alert only when clearly eligible

scoring:
  hide_below: 40          # below → Hidden
  alert_above: 75         # at or above → email alert (if eligible, confident and not a scam)
  auto_resume_above: 85   # at or above → resume + kit built automatically; null = only on Shortlisted

resume:
  template: classic       # your LaTeX layout (src/jobradar/resume/templates/), or a path to a .tex.j2
  max_pages: 1
  tailor: true            # false: every resume is profile.yaml as written
  max_per_day: 10         # automatic builds (score >= auto_resume_above); Shortlisted always builds

links:
  extra_shorteners: []    # your channels' own redirect domains, e.g. ["go.somejobs.in"]
  deny: []                # never jobs: hosts or host/path prefixes, e.g.
                          # ["acciojob.com/full-stack-development-courses"]

storage:
  local_dir: ./output     # resumes: {Company}_{Role}_{yyyymmdd}_v{n}.pdf, with the .tex next to it

email:
  smtp_host: smtp.gmail.com
  smtp_port: 587         # STARTTLS
  imap_host: imap.gmail.com

notify:
  alerts: true
  dry_run: true           # alerts are saved to data/alerts/*.html, not emailed; set false
                          #   once those previews look right
  alert_batch_minutes: 10 # first alert is instant; later ones within 10 min come as one email
  max_alerts_per_day: 10
  alert_max_age_days: 2   # only jobs first seen this recently can alert
  old_posting_days: 30    # published longer ago by the company's own site: no instant alert
  digest: true            # summary email at each digest time (skipped when nothing happened)
  digest_times: ["09:00", "19:00"]
  closing_reminders: true # email when a job you shortlisted closes today or tomorrow
  followups: true         # a follow-up draft when a job you set to Applied gets no reply
  followup_after_days: 10 #   for this long (at most 2 per job; Notion's Followed Up resets it)
  email_actions: true     # "I applied" / "Not interested" buttons in emails (read over IMAP)
  skill_gaps: true        # weekly digest section: skills your good matches name that you lack
  company_replies: true   # read new mail from companies you applied to; suggest Interview etc.
  timezone: Asia/Kolkata
