services:
  jobradar:
    build: .
    image: jobradar:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data        # SQLite, Telegram session, Drive token
      - ./output:/app/output    # PDFs
      - ./config:/app/config    # config.yaml, profile.yaml, custom templates

  # A local Postgres for the SaaS branch (SAASPLAN.md, PR 3): `docker compose up -d postgres`,
  # then DATABASE_URL=postgresql://jobradar:jobradar@localhost:55432/jobradar in .env.
  # Only this computer can reach it; the beta uses a hosted Postgres (Neon) instead.
  postgres:
    image: postgres:17
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: jobradar
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  # Added in later releases (see PLAN.md):
  # browser:   Playwright Chromium for JavaScript pages            (v0.2)
  # wa-bridge: Node WhatsApp sidecar, `profiles: [whatsapp]`        (v1.0, experimental)

volumes:
  postgres:
