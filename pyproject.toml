[project]
name = "jobradar-agent"  # PyPI name; the CLI command and import package stay `jobradar`
version = "0.0.1"
description = "Self-hosted agent that turns job channels into a ranked Notion inbox with tailored resumes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ThePlator" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Runtime dependencies are added per release as each module lands (see PLAN.md).
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
    "telethon>=1.36",
    "httpx>=0.27",
    "litellm>=1.50",
    "trafilatura>=1.12",
    "pypdf>=6.20.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Renders JavaScript-only job pages. After installing: `uv run playwright install chromium`.
browser = ["playwright>=1.45"]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
postgres = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.scripts]
jobradar = "jobradar.__main__:app"

# Plugin entry-point groups (built-ins are registered here as they are implemented):
# [project.entry-points."jobradar.sources"]
# [project.entry-points."jobradar.site_adapters"]
# [project.entry-points."jobradar.storage"]
# [project.entry-points."jobradar.sinks"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "types-PyYAML",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests feed real-looking posts: decorative Unicode and en dashes are the input under test.
"tests/**" = ["S101", "S311", "ASYNC109", "ASYNC110", "E501", "RUF001"]
# Generated by Alembic: column lists and CHECK constraints are long by nature.
"src/jobradar/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    # Starlette's test client asks for its new HTTP library; the old one works the same here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "playwright", "playwright.*"]
ignore_missing_imports = true
