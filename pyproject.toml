[project]
name = "jobradar-agent"  # PyPI name; the CLI command and import package stay `jobradar`
version = "0.0.1"
description = "Self-hosted agent that turns job channels into a ranked Notion inbox with tailored resumes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ThePlator" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Runtime dependencies are added per release as each module lands (see PLAN.md).
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
jobradar = "jobradar.__main__:app"

# Plugin entry-point groups (built-ins are registered here as they are implemented):
# [project.entry-points."jobradar.sources"]
# [project.entry-points."jobradar.site_adapters"]
# [project.entry-points."jobradar.storage"]
# [project.entry-points."jobradar.sinks"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "ASYNC109", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
